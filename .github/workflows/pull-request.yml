name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Type Check & Tests
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  validate-package:
    name: Validate Package
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: npm pack --dry-run

  validate-android:
    name: Validate Android
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate build configuration
        working-directory: android
        run: ./gradlew tasks --no-daemon

  validate-ios:
    name: Validate iOS
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate podspec syntax
        run: ruby -e "Pod::Spec.from_file('ConektaElements.podspec')" 2>/dev/null || ruby -c ConektaElements.podspec

      - name: Verify iOS source files exist
        run: |
          FILES=$(find ios -type f -name "*.swift" -o -name "*.m" -o -name "*.h" | wc -l)
          echo "Found $FILES iOS source file(s)"
          if [ "$FILES" -eq 0 ]; then
            echo "Error: No iOS source files found in ios/"
            exit 1
          fi
