name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Type Check & Tests
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  validate-package:
    name: Validate Package
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: npm pack --dry-run

  android-build:
    name: Android Build
    runs-on: aws-runner-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check Android build files
        working-directory: android
        run: ./gradlew tasks --no-daemon
        env:
          GP_USER: ${{ github.actor }}
          GP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
