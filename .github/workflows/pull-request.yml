name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  validate-versions:
    name: Validate Versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify conektaElements config in package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.conektaElements?.version) {
              console.error('Error: conektaElements.version missing in package.json');
              process.exit(1);
            }
            if (!pkg.conektaElements?.iosChecksum) {
              console.error('Error: conektaElements.iosChecksum missing in package.json');
              process.exit(1);
            }
            console.log('conektaElements.version:', pkg.conektaElements.version);
            console.log('conektaElements.iosChecksum:', pkg.conektaElements.iosChecksum);
          "

  validate-package:
    name: Validate Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package contents
        run: npm pack --dry-run

  validate-android:
    name: Validate Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate build configuration
        working-directory: android
        run: ./gradlew tasks --no-daemon

      # Compiles the bridge against the Conekta SDK and React Native: a dependency that does not resolve or code
      # that does not compile fails the job. A Conekta prerelease comes from GitHub Packages, which answers only
      # with a token: the workflow's own, which reads the package once conekta-elements grants this repository
      # access to it (Package settings > Manage Actions access).
      - name: Build the Android library
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GP_USER: ${{ secrets.GH_USER }}
          GP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-ios:
    name: Validate iOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify podspec exists
        run: |
          if [ ! -f ConektaElements.podspec ]; then
            echo "Error: ConektaElements.podspec not found"
            exit 1
          fi
          echo "ConektaElements.podspec found"

      - name: Verify iOS source files exist
        run: |
          FILES=$(find ios -type f \( -name "*.swift" -o -name "*.m" -o -name "*.h" \) | wc -l)
          echo "Found $FILES iOS source file(s)"
          if [ "$FILES" -eq 0 ]; then
            echo "Error: No iOS source files found in ios/"
            exit 1
          fi
