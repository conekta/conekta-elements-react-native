name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    # npmjs takes stable releases only, for now. Every semver prerelease carries a hyphen (1.0.0-beta.1, -rc.1,
    # -next.0), whatever its name: those go to GitHub Packages alone (publish-github-packages.yml).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate CHANGELOG contains version entry
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "\[${PACKAGE_VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain an entry for version ${PACKAGE_VERSION}."
            echo "Please add a section '## [${PACKAGE_VERSION}]' before publishing."
            exit 1
          fi

      - name: Validate tag matches package version
        id: validate
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      # Only a stable version reaches this job, so it is always npm's `latest`
      - name: Publish to npm
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
