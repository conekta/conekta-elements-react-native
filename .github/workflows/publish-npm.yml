name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate CHANGELOG contains version entry
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "\[${PACKAGE_VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain an entry for version ${PACKAGE_VERSION}."
            echo "Please add a section '## [${PACKAGE_VERSION}]' before publishing."
            exit 1
          fi

      - name: Validate tag matches package version
        id: validate
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

          # Determine npm dist-tag
          if echo "$TAG_VERSION" | grep -q "alpha"; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$TAG_VERSION" | grep -q "beta"; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --tag ${{ steps.validate.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
