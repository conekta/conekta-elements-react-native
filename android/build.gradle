def packageJson = new groovy.json.JsonSlurper().parse(file("$projectDir/../package.json"))

buildscript {
    ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '2.1.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdkVersion 36
    namespace "io.conekta.rn"

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Conekta Components with Compose UI
    implementation "io.conekta:conekta-components-compose:${packageJson.conektaElements.version}"

    // React Native: the host app's React Native plugin names the version. Built alone (this repository's CI)
    // nothing does, so the lowest version this library supports stands in
    implementation rootProject == project ? "com.facebook.react:react-android:0.81.6" : "com.facebook.react:react-android"

    // Compose: the SDK lists it for the runtime only, the bridge compiles against it
    implementation platform("androidx.compose:compose-bom:2025.09.00")
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.compose.ui:ui"
}
